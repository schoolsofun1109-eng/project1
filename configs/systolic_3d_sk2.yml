num_cores: 1
core_freq_mhz: 940
core_stats_print_period_cycles: 10000
num_systolic_array_per_core: 1

# ===== PE Array:  M(token) x N(output-ch) x P(input-ch) =====
pe_M: 128
pe_N: 128
pe_P: 2

# ===== 1D SIMD =====
simd_K: 128
simd_bit: 256

dram_type: ramulator2
dram_freq_mhz: 940
dram_channels: 16
dram_stats_print_period_cycles: 10000
ramulator_config_path: ../configs/ramulator2_configs/HBM2_TPUv3.yaml

icnt_type: simple
icnt_latency_cycles: 10
icnt_freq_mhz: 940
icnt_injection_ports_per_core: 16

# IMEM (Input Memory) - 128KB
imem_num_banks: 8
imem_sram_bitwidth: 256
imem_sram_depth: 512

# WMEM (Weight Memory) - 128KB
wmem_num_banks: 8
wmem_sram_bitwidth: 256
wmem_sram_depth: 512

# OMEM (Output Memory) - 128KB
omem_num_banks: 8
omem_sram_bitwidth: 256
omem_sram_depth: 512

# Spike's systolic_array.{h,cc} hardcodes a single square sa_dim used for both
# K-depth and N-width, so it cannot correctly validate Sk>1 (3D depth) or
# Sm!=Sn (rect) arrays -- confirmed: Sk=2 K=256 case returns 128 (drops the
# 2nd K-pass) instead of 256. Matches the same accuracy-bypass already used by
# the sibling rect_*_real.yml configs. Timing (gem5/TOGSim cycles, util, BW)
# is unaffected and remains real.
pytorchsim_functional_mode: false
pytorchsim_timing_mode: true

codegen_mapping_strategy: heuristic
codegen_autotune_max_retry: 5
codegen_autotune_template_topk: 5

codegen_compiler_optimization: all

# 3D PE array: K-reduction depth
